name: Release Desktop Builds

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
            arch: amd64
            flutter_arch: x64
            artifact: linux_amd64.tar.gz
            format: tar.gz
            build_dir: build/linux/x64/release/bundle
          - runner: ubuntu-24.04-arm
            target: linux
            arch: arm64
            flutter_arch: arm64
            artifact: linux_arm64.tar.gz
            format: tar.gz
            build_dir: build/linux/arm64/release/bundle
          - runner: macos-latest
            target: darwin
            arch: amd64
            flutter_arch: x64
            artifact: darwin_amd64.tar.gz
            format: tar.gz
            build_dir: build/macos/Build/Products/Release/cpaclient.app
          - runner: macos-14
            target: darwin
            arch: arm64
            flutter_arch: arm64
            artifact: darwin_arm64.tar.gz
            format: tar.gz
            build_dir: build/macos/Build/Products/Release/cpaclient.app
          - runner: windows-latest
            target: windows
            arch: amd64
            flutter_arch: x64
            artifact: windows_amd64.zip
            format: zip
            build_dir: build/windows/x64/runner/Release
          - runner: windows-11-arm
            target: windows
            arch: arm64
            flutter_arch: x64
            artifact: windows_arm64.zip
            format: zip
            build_dir: build/windows/arm64/runner/Release

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        if: ${{ !(matrix.target == 'linux' && matrix.arch == 'arm64') }}
        with:
          channel: stable
          flutter-version: 3.35.5
          architecture: ${{ matrix.flutter_arch }}

      - name: Setup Flutter SDK (linux arm64)
        if: ${{ matrix.target == 'linux' && matrix.arch == 'arm64' }}
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch 3.35.5 "$HOME/flutter"
          export PATH="$HOME/flutter/bin:$PATH"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          flutter --version

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            liblzma-dev

          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y libayatana-appindicator3-dev
          elif apt-cache show libappindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y libappindicator3-dev
          else
            echo "No supported appindicator dev package found"
            exit 1
          fi

          pkg-config --exists libsecret-1
          pkg-config --exists ayatana-appindicator3-0.1 || pkg-config --exists appindicator3-0.1
          pkg-config --modversion libsecret-1
          pkg-config --modversion gtk+-3.0

      - name: Resolve app version from tag
        id: app_version
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');

            const tag = process.env.GITHUB_REF_NAME || '';
            if (!tag.startsWith('v')) {
              core.setFailed(`Tag must start with v, got: ${tag}`);
              return;
            }

            const versionText = tag.slice(1);
            const [buildName, explicitBuildNumber] = versionText.split('+');

            if (!/^\d+\.\d+\.\d+$/.test(buildName)) {
              core.setFailed(`Tag version must be in vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH+BUILD format, got: ${tag}`);
              return;
            }

            const buildNumber = explicitBuildNumber || process.env.GITHUB_RUN_NUMBER;
            if (!/^\d+$/.test(buildNumber)) {
              core.setFailed(`Build number must be numeric, got: ${buildNumber}`);
              return;
            }

            core.setOutput('build_name', buildName);
            core.setOutput('build_number', buildNumber);
            core.info(`Resolved Flutter build version: ${buildName}+${buildNumber}`);

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux
        if: matrix.target == 'linux'
        run: flutter build linux --release --build-name="${{ steps.app_version.outputs.build_name }}" --build-number="${{ steps.app_version.outputs.build_number }}"

      - name: Build macOS
        if: matrix.target == 'darwin'
        run: flutter build macos --release --build-name="${{ steps.app_version.outputs.build_name }}" --build-number="${{ steps.app_version.outputs.build_number }}"

      - name: Build Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release --build-name="${{ steps.app_version.outputs.build_name }}" --build-number="${{ steps.app_version.outputs.build_number }}"

      - name: Verify build output (linux/macos)
        if: matrix.format == 'tar.gz'
        shell: bash
        run: |
          if [ ! -e "${{ matrix.build_dir }}" ]; then
            echo "Build output not found: ${{ matrix.build_dir }}"
            exit 1
          fi

      - name: Package artifact (linux/macos)
        if: matrix.format == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp -r "${{ matrix.build_dir }}" dist/
          tar -czf "${{ matrix.artifact }}" -C dist .

      - name: Resolve build output (windows)
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          $candidates = @(
            "${{ matrix.build_dir }}",
            "build/windows/arm64/runner/Release",
            "build/windows/x64/runner/Release",
            "build/windows/runner/Release"
          ) | Select-Object -Unique

          $resolved = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $resolved) {
            Write-Host "Checked candidates:"
            $candidates | ForEach-Object { Write-Host " - $_" }
            Write-Host "Existing directories under build/windows (if any):"
            if (Test-Path "build/windows") {
              Get-ChildItem "build/windows" -Directory -Recurse | ForEach-Object { Write-Host " - $($_.FullName)" }
            }
            Write-Error "Build output not found for windows artifact packaging"
          }

          "WINDOWS_BUILD_DIR=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved Windows build output: $resolved"

      - name: Package artifact (windows)
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force "$env:WINDOWS_BUILD_DIR/*" dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release/ \;
          ls -lah release

      - name: Resolve release version from tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(\+([0-9]+))?$ ]]; then
            echo "Invalid tag format: $tag"
            echo "Expected: vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH+BUILD"
            exit 1
          fi

          build_name="${BASH_REMATCH[1]}"
          build_number="${BASH_REMATCH[3]}"
          if [ -z "$build_number" ]; then
            build_number="${GITHUB_RUN_NUMBER}"
          fi

          app_version="${build_name}+${build_number}"
          echo "APP_VERSION=${app_version}" >> "$GITHUB_ENV"
          echo "Resolved app version: ${app_version}"

      - name: Upload to GitHub release/tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="$(printf 'Automated release for %s\n\nApp version: %s\n' "${GITHUB_REF_NAME}" "${APP_VERSION}")"

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "$notes"
          fi

          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" release/* --clobber
